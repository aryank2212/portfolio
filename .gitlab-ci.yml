image: node:22-alpine

stages:
  - install
  - lint
  - typecheck
  - build
  - test
  - pages

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .next/cache/

install:
  stage: install
  script:
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint

typecheck:
  stage: typecheck
  script:
    - npx tsc --noEmit

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - out/
      - .next/

test:
  stage: test
  script:
    - echo "Playwright and Lighthouse CI tests would execute here against the out/ directory"
    # Placeholder for actual test execution to keep pipeline green during initial setup
    # e.g., npx playwright test
    # e.g., lhci autorun

pages:
  stage: pages
  script:
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
