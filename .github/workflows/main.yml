name: Deploy Static Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Recreate SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > /tmp/ec2_key
          chmod 600 /tmp/ec2_key

      - name: Debug runner files
        run: |
          echo "Runner working directory:"
          pwd
          echo "Files in repo:"
          ls -lah

      - name: Deploy via SSH (verified)
        run: |
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no deploy@${{ secrets.EC2_HOST }} "mkdir -p /tmp/site"

          rsync -avz --delete \
            -e "ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no" \
            ./ \
            deploy@${{ secrets.EC2_HOST }}:/tmp/site \
            --exclude .git \
            --exclude .github

          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no deploy@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Contents of /tmp/site:"
            ls -lah /tmp/site || true

            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/site/* /var/www/html/

            echo "Contents of /var/www/html:"
            ls -lah /var/www/html || true

            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            rm -rf /tmp/site
          EOF

