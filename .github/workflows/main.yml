name: Deploy Static Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          echo "$EC2_SSH_KEY_B64" | base64 -d > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
           - name: Debug SSH key file
        run: |
          ls -l /tmp/ec2_key || echo "key file missing"
          wc -c /tmp/ec2_key || echo "cannot read key file"

      - name: Deploy via native SSH
        run: |
          rsync -avz --delete \
            -e "ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no" \
            index.html 404.html css js assets \
            deploy@${{ secrets.EC2_HOST }}:/tmp/site

          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no deploy@${{ secrets.EC2_HOST }} << 'EOF'
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/site/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            rm -rf /tmp/site
          EOF

