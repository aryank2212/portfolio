<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | Aryan Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #00d4ff;
            --text: #e0e0e0;
            --dim: #555;
            --mono: 'Courier Prime', monospace;
            --surface: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #222;
            background: rgba(5, 5, 5, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title {
            font-family: var(--mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .back-btn {
            color: var(--dim);
            text-decoration: none;
            font-family: var(--mono);
            font-size: 0.8rem;
            border: 1px solid #333;
            padding: 8px 16px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            flex: 1;
            display: flex;
            padding: 1rem;
            gap: 1rem;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 100px);
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 100%;
                max-height: 200px;
            }
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--accent);
        }

        .btn-new {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 4px 12px;
            font-family: var(--mono);
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
        }

        .note-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
        }

        .note-item:hover {
            background: #111;
        }

        .note-item.active {
            background: rgba(0, 212, 255, 0.1);
            border-left: 2px solid var(--accent);
        }

        .note-title {
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-date {
            font-size: 0.65rem;
            color: var(--dim);
            font-family: var(--mono);
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid #222;
        }

        .editor-toolbar {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #222;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--dim);
            padding: 6px 10px;
            font-family: var(--mono);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .toolbar-btn.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .title-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            padding: 0 1rem;
        }

        .editor-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor,
        .preview {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .editor {
            background: #0a0a0a;
            border: none;
            color: var(--text);
            resize: none;
            font-family: var(--mono);
            outline: none;
        }

        .preview {
            background: #080808;
            border-left: 1px solid #222;
        }

        .preview h1,
        .preview h2,
        .preview h3 {
            color: var(--accent);
            margin: 1rem 0 0.5rem;
        }

        .preview h1 {
            font-size: 1.5rem;
        }

        .preview h2 {
            font-size: 1.2rem;
        }

        .preview h3 {
            font-size: 1rem;
        }

        .preview code {
            background: #1a1a1a;
            padding: 2px 6px;
            font-family: var(--mono);
            font-size: 0.85rem;
        }

        .preview pre {
            background: #1a1a1a;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .preview blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            color: #888;
            margin: 0.5rem 0;
        }

        .preview ul,
        .preview ol {
            margin-left: 1.5rem;
        }

        .preview a {
            color: var(--accent);
        }

        .editor-only .preview {
            display: none;
        }

        .preview-only .editor {
            display: none;
        }

        .split .editor,
        .split .preview {
            width: 50%;
        }

        .status-bar {
            padding: 0.5rem 1rem;
            border-top: 1px solid #222;
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--dim);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <header>
        <span class="title">>> NOTES</span>
        <a href="../index.html" class="back-btn">[ ← BACK ]</a>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">MY NOTES</span>
                <button class="btn-new" id="btn-new">+ NEW</button>
            </div>
            <div class="notes-list" id="notes-list"></div>
        </div>

        <div class="editor-section" id="editor-section">
            <div class="editor-toolbar">
                <input type="text" class="title-input" id="note-title" placeholder="Untitled Note">
                <button class="toolbar-btn" id="btn-edit" title="Edit">EDIT</button>
                <button class="toolbar-btn" id="btn-split" title="Split">SPLIT</button>
                <button class="toolbar-btn" id="btn-preview" title="Preview">PREVIEW</button>
                <button class="toolbar-btn" id="btn-delete" title="Delete">DELETE</button>
            </div>
            <div class="editor-wrapper split" id="editor-wrapper">
                <textarea class="editor" id="editor" placeholder="Write in Markdown..."></textarea>
                <div class="preview" id="preview"></div>
            </div>
            <div class="status-bar">
                <span id="word-count">0 words</span>
                <span id="save-status">Saved to localStorage</span>
            </div>
        </div>
    </div>

    <script>
        const notesList = document.getElementById('notes-list');
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const titleInput = document.getElementById('note-title');
        const wrapper = document.getElementById('editor-wrapper');
        const wordCount = document.getElementById('word-count');

        let notes = JSON.parse(localStorage.getItem('portfolio-notes') || '[]');
        let currentNoteId = null;

        function saveNotes() {
            localStorage.setItem('portfolio-notes', JSON.stringify(notes));
        }

        function renderNotesList() {
            notesList.innerHTML = notes.map(n => `
                <div class="note-item ${n.id === currentNoteId ? 'active' : ''}" data-id="${n.id}">
                    <div class="note-title">${n.title || 'Untitled'}</div>
                    <div class="note-date">${new Date(n.updated).toLocaleDateString()}</div>
                </div>
            `).join('');

            notesList.querySelectorAll('.note-item').forEach(item => {
                item.addEventListener('click', () => loadNote(item.dataset.id));
            });
        }

        function loadNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                currentNoteId = id;
                titleInput.value = note.title;
                editor.value = note.content;
                renderPreview();
                renderNotesList();
            }
        }

        function createNote() {
            const note = {
                id: Date.now().toString(),
                title: 'New Note',
                content: '# New Note\n\nStart writing...',
                created: Date.now(),
                updated: Date.now()
            };
            notes.unshift(note);
            saveNotes();
            loadNote(note.id);
            renderNotesList();
        }

        function updateCurrentNote() {
            if (!currentNoteId) return;
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.title = titleInput.value || 'Untitled';
                note.content = editor.value;
                note.updated = Date.now();
                saveNotes();
                renderNotesList();
            }
        }

        function deleteCurrentNote() {
            if (!currentNoteId) return;
            if (confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                saveNotes();
                currentNoteId = null;
                if (notes.length > 0) loadNote(notes[0].id);
                else { titleInput.value = ''; editor.value = ''; preview.innerHTML = ''; }
                renderNotesList();
            }
        }

        // Simple Markdown parser
        function parseMarkdown(md) {
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/^\- (.*$)/gim, '<li>$1</li>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/\n/g, '<br>');
        }

        function renderPreview() {
            preview.innerHTML = parseMarkdown(editor.value);
            const words = editor.value.trim().split(/\s+/).filter(w => w).length;
            wordCount.textContent = `${words} words`;
        }

        // Event listeners
        editor.addEventListener('input', () => { renderPreview(); updateCurrentNote(); });
        titleInput.addEventListener('input', updateCurrentNote);
        document.getElementById('btn-new').addEventListener('click', createNote);
        document.getElementById('btn-delete').addEventListener('click', deleteCurrentNote);

        document.getElementById('btn-edit').addEventListener('click', () => {
            wrapper.className = 'editor-wrapper editor-only';
        });
        document.getElementById('btn-split').addEventListener('click', () => {
            wrapper.className = 'editor-wrapper split';
        });
        document.getElementById('btn-preview').addEventListener('click', () => {
            wrapper.className = 'editor-wrapper preview-only';
        });

        // Initialize
        if (notes.length === 0) {
            notes.push({
                id: '1', title: 'Welcome to Notes',
                content: '# Welcome to Notes\n\nThis is a **markdown** note-taking app.\n\n## Features\n- Write in Markdown\n- Auto-save to localStorage\n- Split view editing\n\n> Your notes are stored locally in your browser.',
                created: Date.now(), updated: Date.now()
            });
            saveNotes();
        }
        renderNotesList();
        loadNote(notes[0].id);
    </script>
</body>

</html>
