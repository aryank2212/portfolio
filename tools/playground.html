<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Playground | Aryan Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #00d4ff;
            --text: #e0e0e0;
            --dim: #555;
            --mono: 'Courier Prime', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #222;
            background: rgba(5, 5, 5, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-family: var(--mono);
            color: var(--accent);
            font-size: 0.85rem;
        }

        .header-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--dim);
            padding: 6px 12px;
            font-family: var(--mono);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
            }
        }

        .editors {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            min-width: 0;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #222;
            background: #0a0a0a;
        }

        .tab {
            padding: 0.6rem 1rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--dim);
            cursor: pointer;
            border-right: 1px solid #222;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            background: #111;
        }

        .editor-panes {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .editor-pane {
            display: none;
            flex: 1;
        }

        .editor-pane.active {
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            background: #0a0a0a;
            border: none;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.8rem;
            padding: 1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
            tab-size: 2;
        }

        textarea::placeholder {
            color: var(--dim);
        }

        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .output-header {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #222;
            background: #0a0a0a;
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #output-frame {
            flex: 1;
            border: none;
            background: #fff;
        }

        .console {
            height: 120px;
            background: #0a0a0a;
            border-top: 1px solid #222;
            font-family: var(--mono);
            font-size: 0.7rem;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .console-entry {
            padding: 2px 0;
            border-bottom: 1px solid #111;
        }

        .console-log {
            color: var(--text);
        }

        .console-error {
            color: #ff4444;
        }

        .console-warn {
            color: #ffcc00;
        }

        .templates {
            display: flex;
            gap: 0.5rem;
        }

        select {
            background: #111;
            border: 1px solid #333;
            color: var(--text);
            padding: 4px 8px;
            font-family: var(--mono);
            font-size: 0.65rem;
        }
    </style>
</head>

<body>
    <header>
        <span class="title">>> CODE_PLAYGROUND</span>
        <div class="header-btns">
            <select id="templates">
                <option value="">Load Template...</option>
                <option value="hello">Hello World</option>
                <option value="clock">Digital Clock</option>
                <option value="todo">Todo App</option>
                <option value="animation">CSS Animation</option>
            </select>
            <button class="btn primary" id="run-btn">▶ RUN</button>
            <a href="../index.html" class="btn">← BACK</a>
        </div>
    </header>

    <div class="main">
        <div class="editors">
            <div class="tabs">
                <div class="tab active" data-tab="html">HTML</div>
                <div class="tab" data-tab="css">CSS</div>
                <div class="tab" data-tab="js">JS</div>
            </div>
            <div class="editor-panes">
                <div class="editor-pane active" data-pane="html">
                    <textarea id="html-editor" placeholder="<!-- HTML here -->"></textarea>
                </div>
                <div class="editor-pane" data-pane="css">
                    <textarea id="css-editor" placeholder="/* CSS here */"></textarea>
                </div>
                <div class="editor-pane" data-pane="js">
                    <textarea id="js-editor" placeholder="// JavaScript here"></textarea>
                </div>
            </div>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span>OUTPUT</span>
                <button class="btn" id="clear-console">Clear Console</button>
            </div>
            <iframe id="output-frame"></iframe>
            <div class="console" id="console"></div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const cssEditor = document.getElementById('css-editor');
        const jsEditor = document.getElementById('js-editor');
        const outputFrame = document.getElementById('output-frame');
        const consoleEl = document.getElementById('console');

        const templates = {
            hello: {
                html: '<div class="container">\n  <h1>Hello, World!</h1>\n  <p>Welcome to the code playground</p>\n  <button onclick="greet()">Click me</button>\n</div>',
                css: '.container {\n  text-align: center;\n  padding: 2rem;\n  font-family: Arial, sans-serif;\n}\n\nh1 {\n  color: #00d4ff;\n}\n\nbutton {\n  background: #00d4ff;\n  color: #000;\n  border: none;\n  padding: 10px 20px;\n  cursor: pointer;\n  font-size: 1rem;\n}',
                js: 'function greet() {\n  console.log("Hello from the playground!");\n  alert("You clicked the button!");\n}'
            },
            clock: {
                html: '<div class="clock" id="clock">00:00:00</div>',
                css: 'body {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  background: #111;\n  margin: 0;\n}\n\n.clock {\n  font-size: 4rem;\n  font-family: monospace;\n  color: #00d4ff;\n  text-shadow: 0 0 20px rgba(0,212,255,0.5);\n}',
                js: 'function updateClock() {\n  const now = new Date();\n  const time = now.toLocaleTimeString("en-GB");\n  document.getElementById("clock").textContent = time;\n}\n\nsetInterval(updateClock, 1000);\nupdateClock();'
            },
            todo: {
                html: '<div class="todo-app">\n  <h2>Todo List</h2>\n  <input type="text" id="input" placeholder="Add task...">\n  <button onclick="addTask()">Add</button>\n  <ul id="list"></ul>\n</div>',
                css: '.todo-app {\n  max-width: 400px;\n  margin: 2rem auto;\n  font-family: Arial;\n}\n\ninput {\n  padding: 8px;\n  width: 70%;\n}\n\nbutton {\n  padding: 8px 16px;\n  background: #00d4ff;\n  color: #000;\n  border: none;\n  cursor: pointer;\n}\n\nli {\n  padding: 8px;\n  margin: 4px 0;\n  background: #f5f5f5;\n  cursor: pointer;\n}\n\nli.done { text-decoration: line-through; color: #888; }',
                js: 'function addTask() {\n  const input = document.getElementById("input");\n  const list = document.getElementById("list");\n  if (input.value.trim()) {\n    const li = document.createElement("li");\n    li.textContent = input.value;\n    li.onclick = () => li.classList.toggle("done");\n    list.appendChild(li);\n    input.value = "";\n    console.log("Task added:", li.textContent);\n  }\n}'
            },
            animation: {
                html: '<div class="box"></div>',
                css: 'body {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  background: #111;\n  margin: 0;\n}\n\n.box {\n  width: 100px;\n  height: 100px;\n  background: linear-gradient(135deg, #00d4ff, #0066ff);\n  animation: float 3s ease-in-out infinite;\n  border-radius: 10px;\n}\n\n@keyframes float {\n  0%, 100% { transform: translateY(0) rotate(0deg); }\n  50% { transform: translateY(-30px) rotate(180deg); }\n}',
                js: 'console.log("Animation running!");'
            }
        };

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.querySelector(`.editor-pane[data-pane="${tab.dataset.tab}"]`).classList.add('active');
            });
        });

        // Template loader
        document.getElementById('templates').addEventListener('change', (e) => {
            const t = templates[e.target.value];
            if (t) {
                htmlEditor.value = t.html;
                cssEditor.value = t.css;
                jsEditor.value = t.js;
                runCode();
            }
            e.target.value = '';
        });

        function logToConsole(type, ...args) {
            const entry = document.createElement('div');
            entry.className = `console-entry console-${type}`;
            entry.textContent = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            consoleEl.appendChild(entry);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function runCode() {
            consoleEl.innerHTML = '';
            const html = htmlEditor.value;
            const css = cssEditor.value;
            const js = jsEditor.value;

            const doc = `
                <!DOCTYPE html>
                <html>
                <head><style>${css}</style></head>
                <body>
                    ${html}
                    <script>
                        const _log = console.log;
                        const _error = console.error;
                        const _warn = console.warn;
                        console.log = (...args) => { parent.postMessage({type:'log',args}, '*'); _log(...args); };
                        console.error = (...args) => { parent.postMessage({type:'error',args}, '*'); _error(...args); };
                        console.warn = (...args) => { parent.postMessage({type:'warn',args}, '*'); _warn(...args); };
                        window.onerror = (msg) => { parent.postMessage({type:'error',args:[msg]}, '*'); };
                        try { ${js} } catch(e) { console.error(e.message); }
                    <\/script>
                </body>
                </html>
            `;

            outputFrame.srcdoc = doc;
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type) {
                logToConsole(e.data.type, ...e.data.args);
            }
        });

        document.getElementById('run-btn').addEventListener('click', runCode);
        document.getElementById('clear-console').addEventListener('click', () => consoleEl.innerHTML = '');

        // Auto-run on input with debounce
        let runTimeout;
        [htmlEditor, cssEditor, jsEditor].forEach(ed => {
            ed.addEventListener('input', () => {
                clearTimeout(runTimeout);
                runTimeout = setTimeout(runCode, 500);
            });
        });

        // Load hello template by default
        htmlEditor.value = templates.hello.html;
        cssEditor.value = templates.hello.css;
        jsEditor.value = templates.hello.js;
        runCode();
    </script>
</body>

</html>
