<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum | Aryan Kumar</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent: #00d4ff;
            --accent-dim: rgba(0, 212, 255, 0.3);
            --text-main: #e0e0e0;
            --text-dim: #777;
            --font-mono: 'Courier Prime', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #222;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
        }

        .back-btn {
            color: var(--text-dim);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            border: 1px solid #333;
            padding: 8px 16px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            flex: 1;
            display: flex;
            padding: 1rem;
            gap: 1rem;
            flex-direction: row;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
        }

        .canvas-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas {
            border: 1px solid #333;
            background: #0a0a0a;
            max-width: 100%;
            height: auto;
        }

        .stats {
            color: var(--accent);
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .controls-panel {
            width: 280px;
            min-width: 280px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #333;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .controls-panel {
                width: 100%;
                min-width: unset;
                max-height: unset;
            }
        }

        .panel-title {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.8rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .control-group {
            margin-bottom: 0.5rem;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-family: var(--font-mono);
        }

        .control-group label span {
            color: var(--accent);
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-dim);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            border: none;
        }

        .btn-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-dim);
            padding: 8px 14px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-dim);
        }

        .preset-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 0.3rem;
            padding: 6px 10px;
        }

        .info {
            font-size: 0.7rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>
    <header>
        <span class="title">>> DOUBLE_PENDULUM_SIMULATION</span>
        <a href="../index.html" class="back-btn">[ ← BACK ]</a>
    </header>

    <div class="container">
        <div class="canvas-section">
            <canvas id="canvas" width="600" height="500"></canvas>
            <div class="stats" id="stats">θ₁: 0° | θ₂: 0° | E: 0</div>
        </div>

        <div class="controls-panel">
            <div class="panel-title">>> PARAMETERS</div>

            <div class="control-group">
                <label>Rod 1 Length (L₁) <span id="l1Val">150</span>px</label>
                <input type="range" id="l1" min="50" max="200" value="150">
            </div>
            <div class="control-group">
                <label>Rod 2 Length (L₂) <span id="l2Val">150</span>px</label>
                <input type="range" id="l2" min="50" max="200" value="150">
            </div>
            <div class="control-group">
                <label>Mass 1 (m₁) <span id="m1Val">10</span></label>
                <input type="range" id="m1" min="1" max="30" value="10">
            </div>
            <div class="control-group">
                <label>Mass 2 (m₂) <span id="m2Val">10</span></label>
                <input type="range" id="m2" min="1" max="30" value="10">
            </div>
            <div class="control-group">
                <label>Gravity <span id="gVal">9.81</span></label>
                <input type="range" id="gravity" min="1" max="20" value="9.81" step="0.1">
            </div>
            <div class="control-group">
                <label>Initial θ₁ <span id="theta1Val">90</span>°</label>
                <input type="range" id="theta1" min="0" max="180" value="90">
            </div>
            <div class="control-group">
                <label>Initial θ₂ <span id="theta2Val">90</span>°</label>
                <input type="range" id="theta2" min="0" max="180" value="90">
            </div>
            <div class="control-group">
                <label>Speed <span id="speedVal">1.0</span>x</label>
                <input type="range" id="speed" min="0.1" max="3" value="1" step="0.1">
            </div>
            <div class="control-group">
                <label>Damping <span id="dampVal">0.000</span></label>
                <input type="range" id="damping" min="0" max="0.01" value="0" step="0.001">
            </div>

            <div class="panel-title">>> CONTROLS</div>
            <div class="btn-row">
                <button id="btn-reset">RESET</button>
                <button id="btn-pause">PAUSE</button>
            </div>
            <div class="btn-row">
                <button id="btn-trail" class="active">TRAIL</button>
                <button id="btn-trace">TRACE</button>
            </div>

            <div class="panel-title">>> PRESETS</div>
            <button class="preset-btn" data-preset="chaos">🌀 Chaotic Motion</button>
            <button class="preset-btn" data-preset="sync">🔄 Synchronized</button>
            <button class="preset-btn" data-preset="heavy">⚖️ Heavy Bottom</button>
            <button class="preset-btn" data-preset="long">📏 Long Pendulum</button>
            <button class="preset-btn" data-preset="moon">🌙 Low Gravity</button>

            <div class="info">
                <strong>Double Pendulum</strong> is a classic example of deterministic chaos.
                Tiny changes in initial conditions lead to dramatically different trajectories.
                Uses RK4 numerical integration.
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statsEl = document.getElementById('stats');

        // Parameters (will be updated by sliders)
        let params = {
            g: 9.81,
            L1: 150, L2: 150,
            m1: 10, m2: 10,
            damping: 0,
            speed: 1
        };

        // State: [θ1, ω1, θ2, ω2]
        let state = [Math.PI / 2, 0, Math.PI / 2 + 0.01, 0];
        let initialState = [...state];
        let trail = [];
        let tracePoints = [];
        let showTrail = true;
        let showTrace = false;
        let paused = false;

        const ox = canvas.width / 2;
        const oy = 120;
        const dt = 0.02;

        // Slider elements
        const sliders = {
            l1: document.getElementById('l1'),
            l2: document.getElementById('l2'),
            m1: document.getElementById('m1'),
            m2: document.getElementById('m2'),
            gravity: document.getElementById('gravity'),
            theta1: document.getElementById('theta1'),
            theta2: document.getElementById('theta2'),
            speed: document.getElementById('speed'),
            damping: document.getElementById('damping')
        };

        const displays = {
            l1: document.getElementById('l1Val'),
            l2: document.getElementById('l2Val'),
            m1: document.getElementById('m1Val'),
            m2: document.getElementById('m2Val'),
            gravity: document.getElementById('gVal'),
            theta1: document.getElementById('theta1Val'),
            theta2: document.getElementById('theta2Val'),
            speed: document.getElementById('speedVal'),
            damping: document.getElementById('dampVal')
        };

        // Update display values
        function updateDisplays() {
            displays.l1.textContent = sliders.l1.value;
            displays.l2.textContent = sliders.l2.value;
            displays.m1.textContent = sliders.m1.value;
            displays.m2.textContent = sliders.m2.value;
            displays.gravity.textContent = parseFloat(sliders.gravity.value).toFixed(2);
            displays.theta1.textContent = sliders.theta1.value;
            displays.theta2.textContent = sliders.theta2.value;
            displays.speed.textContent = parseFloat(sliders.speed.value).toFixed(1);
            displays.damping.textContent = parseFloat(sliders.damping.value).toFixed(3);
        }

        // Apply slider values to params
        function applyParams() {
            params.L1 = parseInt(sliders.l1.value);
            params.L2 = parseInt(sliders.l2.value);
            params.m1 = parseInt(sliders.m1.value);
            params.m2 = parseInt(sliders.m2.value);
            params.g = parseFloat(sliders.gravity.value);
            params.speed = parseFloat(sliders.speed.value);
            params.damping = parseFloat(sliders.damping.value);
        }

        // Reset simulation
        function reset() {
            const θ1 = parseInt(sliders.theta1.value) * Math.PI / 180;
            const θ2 = parseInt(sliders.theta2.value) * Math.PI / 180;
            state = [θ1, 0, θ2, 0];
            initialState = [...state];
            trail = [];
            tracePoints = [];
            applyParams();
        }

        // Slider event listeners
        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', () => {
                updateDisplays();
                if (key === 'theta1' || key === 'theta2') {
                    // Only reset on initial angle change
                } else {
                    applyParams();
                }
            });
        });

        // Presets
        const presets = {
            chaos: { l1: 150, l2: 150, m1: 10, m2: 10, g: 9.81, t1: 120, t2: 120, damp: 0 },
            sync: { l1: 150, l2: 150, m1: 10, m2: 10, g: 9.81, t1: 45, t2: 45, damp: 0 },
            heavy: { l1: 100, l2: 150, m1: 5, m2: 25, g: 9.81, t1: 90, t2: 45, damp: 0 },
            long: { l1: 200, l2: 200, m1: 10, m2: 10, g: 9.81, t1: 90, t2: 90, damp: 0 },
            moon: { l1: 150, l2: 150, m1: 10, m2: 10, g: 1.62, t1: 90, t2: 130, damp: 0 }
        };

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const p = presets[btn.dataset.preset];
                sliders.l1.value = p.l1;
                sliders.l2.value = p.l2;
                sliders.m1.value = p.m1;
                sliders.m2.value = p.m2;
                sliders.gravity.value = p.g;
                sliders.theta1.value = p.t1;
                sliders.theta2.value = p.t2;
                sliders.damping.value = p.damp;
                updateDisplays();
                reset();
            });
        });

        // Control buttons
        document.getElementById('btn-reset').addEventListener('click', reset);
        document.getElementById('btn-pause').addEventListener('click', (e) => {
            paused = !paused;
            e.target.textContent = paused ? 'PLAY' : 'PAUSE';
            e.target.classList.toggle('active', paused);
        });
        document.getElementById('btn-trail').addEventListener('click', (e) => {
            showTrail = !showTrail;
            e.target.classList.toggle('active', showTrail);
            if (!showTrail) trail = [];
        });
        document.getElementById('btn-trace').addEventListener('click', (e) => {
            showTrace = !showTrace;
            e.target.classList.toggle('active', showTrace);
            if (!showTrace) tracePoints = [];
        });

        // RK4 derivatives
        function derivatives(s) {
            const [θ1, ω1, θ2, ω2] = s;
            const { g, L1, L2, m1, m2, damping } = params;
            const Δ = θ2 - θ1;

            const denom1 = (m1 + m2) * L1 - m2 * L1 * Math.cos(Δ) * Math.cos(Δ);
            const denom2 = (L2 / L1) * denom1;

            let α1 = (m2 * L1 * ω1 * ω1 * Math.sin(Δ) * Math.cos(Δ) +
                m2 * g * Math.sin(θ2) * Math.cos(Δ) +
                m2 * L2 * ω2 * ω2 * Math.sin(Δ) -
                (m1 + m2) * g * Math.sin(θ1)) / denom1;

            let α2 = (-m2 * L2 * ω2 * ω2 * Math.sin(Δ) * Math.cos(Δ) +
                (m1 + m2) * g * Math.sin(θ1) * Math.cos(Δ) -
                (m1 + m2) * L1 * ω1 * ω1 * Math.sin(Δ) -
                (m1 + m2) * g * Math.sin(θ2)) / denom2;

            // Apply damping
            α1 -= damping * ω1;
            α2 -= damping * ω2;

            return [ω1, α1, ω2, α2];
        }

        function rk4Step(s, dt) {
            const k1 = derivatives(s);
            const k2 = derivatives(s.map((v, i) => v + k1[i] * dt / 2));
            const k3 = derivatives(s.map((v, i) => v + k2[i] * dt / 2));
            const k4 = derivatives(s.map((v, i) => v + k3[i] * dt));
            return s.map((v, i) => v + (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]) * dt / 6);
        }

        function calcEnergy(s) {
            const [θ1, ω1, θ2, ω2] = s;
            const { g, L1, L2, m1, m2 } = params;
            const y1 = -L1 * Math.cos(θ1);
            const y2 = y1 - L2 * Math.cos(θ2);
            const v1sq = (L1 * ω1) ** 2;
            const v2sq = v1sq + (L2 * ω2) ** 2 + 2 * L1 * L2 * ω1 * ω2 * Math.cos(θ1 - θ2);
            return 0.5 * m1 * v1sq + 0.5 * m2 * v2sq + m1 * g * y1 + m2 * g * y2;
        }

        function getPositions(s) {
            const [θ1, , θ2] = s;
            const { L1, L2 } = params;
            const x1 = ox + L1 * Math.sin(θ1);
            const y1 = oy + L1 * Math.cos(θ1);
            const x2 = x1 + L2 * Math.sin(θ2);
            const y2 = y1 + L2 * Math.cos(θ2);
            return { x1, y1, x2, y2 };
        }

        function draw() {
            ctx.fillStyle = showTrail ? 'rgba(10, 10, 10, 0.15)' : '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const { x1, y1, x2, y2 } = getPositions(state);

            // Draw trace (permanent path)
            if (showTrace && tracePoints.length > 1) {
                ctx.beginPath();
                ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
                for (let i = 1; i < tracePoints.length; i++) {
                    ctx.lineTo(tracePoints[i].x, tracePoints[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Draw trail
            if (showTrail && trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                ctx.strokeStyle = 'rgba(0, 212, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw rods
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Draw pivot
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(ox, oy, 6, 0, Math.PI * 2);
            ctx.fill();

            // Draw masses (size based on mass)
            const r1 = 8 + params.m1 / 3;
            const r2 = 8 + params.m2 / 3;

            ctx.fillStyle = '#00d4ff';
            ctx.shadowColor = '#00d4ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x1, y1, r1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x2, y2, r2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Update stats
            const energy = calcEnergy(state);
            const θ1Deg = ((state[0] * 180 / Math.PI) % 360).toFixed(1);
            const θ2Deg = ((state[2] * 180 / Math.PI) % 360).toFixed(1);
            statsEl.textContent = `θ₁: ${θ1Deg}° | θ₂: ${θ2Deg}° | E: ${energy.toFixed(0)}`;
        }

        function update() {
            if (!paused) {
                const steps = Math.ceil(params.speed * 2);
                for (let i = 0; i < steps; i++) {
                    state = rk4Step(state, dt);
                }

                const { x2, y2 } = getPositions(state);
                trail.push({ x: x2, y: y2 });
                if (trail.length > 400) trail.shift();

                if (showTrace) {
                    tracePoints.push({ x: x2, y: y2 });
                    if (tracePoints.length > 5000) tracePoints.shift();
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // Initialize
        updateDisplays();
        applyParams();
        update();
    </script>
</body>

</html>
